<!DOCTYPE html>
<html id="html-root" lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INZ | עוזר חכם</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #002d62;
            --navy-light: #004f9f;
            --orange: #e8601c;
            --white: #ffffff;
            --off-white: #f7f8fa;
            --grey-light: #edf0f5;
            --grey-mid: #c8cfd8;
            --text: #1a2332;
            --text-muted: #5a6478;
            --shadow-sm: 0 2px 8px rgba(0,45,98,0.08);
            --shadow-lg: 0 20px 60px rgba(0,45,98,0.22);
            --radius: 18px;
            --radius-sm: 10px;
        }

        /* ── Accessibility ── */
        /* Large text: only bumps chat bubble content, never breaks layout */
        body.large-text #chat-window .msg { font-size: 15px !important; line-height: 1.7 !important; }
        body.large-text #chat-window #user-input { font-size: 15px !important; }
        /* Everything else stays fixed so it cannot overflow */
        body.large-text #chat-window .shortcut-btn,
        body.large-text #chat-window .access-opt,
        body.large-text #chat-window .shortcuts-label,
        body.large-text #chat-window .header-title,
        body.large-text #chat-window .header-subtitle,
        body.large-text #chat-window .chat-footer-credit { font-size: inherit !important; }

        body.high-contrast { --navy: #000080; --navy-light: #0000cc; --off-white: #fff; --text: #000; --text-muted: #222; --grey-light: #ccc; }
        body.high-contrast .bot-msg { background: #fff; border: 2px solid #000 !important; color: #000; }
        body.high-contrast .user-msg { background: #000080 !important; color: #fff; }
        body.high-contrast .shortcut-btn { border: 2px solid #000 !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Heebo', sans-serif;
            background: transparent;
            color: var(--text);
        }

        /* Chat elements sit on top */
        #chat-bubble, #chat-window { z-index: 1000; }

        @media (max-width: 480px) {
            .hero-stats { gap: 20px; }
            .hero-stat-num { font-size: 24px; }
            #hero { justify-content: flex-start; padding-top: 80px; }
        }

        /* ── Floating Bubble ── */
        #chat-bubble {
            position: fixed;
            bottom: 28px; right: 28px;
            width: 74px; height: 74px;
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,45,98,0.35), 0 0 0 0 rgba(0,79,159,0.4);
            z-index: 1000;
            transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
            animation: pulse-ring 3s ease-out infinite;
        }
        #chat-bubble:hover { transform: scale(1.08); }
        @keyframes pulse-ring {
            0%   { box-shadow: 0 4px 20px rgba(0,45,98,0.35), 0 0 0 0 rgba(0,79,159,0.4); }
            60%  { box-shadow: 0 4px 20px rgba(0,45,98,0.35), 0 0 0 18px rgba(0,79,159,0); }
            100% { box-shadow: 0 4px 20px rgba(0,45,98,0.35), 0 0 0 0 rgba(0,79,159,0); }
        }
        #chat-bubble svg { width: 34px; height: 34px; fill: var(--white); }
        #chat-bubble::after {
            content: '';
            position: absolute; top: 5px; left: 5px;
            width: 14px; height: 14px;
            background: var(--orange); border-radius: 50%;
            border: 2px solid var(--white);
        }
        #chat-bubble.open::after { display: none; }

        /* ── Chat Window ── */
        #chat-window {
            position: fixed;
            bottom: 110px; right: 28px;
            width: 430px;
            max-width: calc(100vw - 40px);
            height: min(800px, calc(100vh - 125px));
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            display: none; flex-direction: column;
            z-index: 999;
            overflow: hidden;
            border: 1px solid rgba(0,45,98,0.08);
            transform-origin: bottom right;
            animation: slideUp 0.3s cubic-bezier(.34,1.36,.64,1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ── Header ── */
        .chat-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            padding: 11px 14px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0; position: relative; overflow: hidden;
        }
        .chat-header::before {
            content: '';
            position: absolute; top: -30px; left: -30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.04); border-radius: 50%;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
        .header-avatar {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.15); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1.5px solid rgba(255,255,255,0.25); flex-shrink: 0;
        }
        .header-avatar svg { width: 20px; height: 20px; fill: white; }
        .header-title { color: var(--white); font-size: 15px; font-weight: 700; }
        .header-subtitle {
            color: rgba(255,255,255,0.65); font-size: 11px;
            display: flex; align-items: center; gap: 5px; margin-top: 2px;
        }
        .status-dot {
            width: 6px; height: 6px; background: #4ade80; border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(74,222,128,0.3); display: inline-block;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .header-controls { display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }
        #lang-selector {
            background: var(--white); border: 1px solid rgba(255,255,255,0.3);
            color: var(--navy); padding: 4px 7px; border-radius: 8px;
            font-size: 11px; font-family: 'Heebo', sans-serif; font-weight: 700; cursor: pointer;
        }
        #lang-selector option { background: var(--white); color: var(--navy); }

        /* Accessibility button — bright orange so it's unmissable */
        .access-toggle-btn {
            background: var(--orange);
            border: 2px solid rgba(255,255,255,0.4);
            color: white; width: 32px; height: 32px;
            border-radius: 8px; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0; font-weight: 700;
        }
        .access-toggle-btn:hover { background: #c04e0e; transform: scale(1.08); }
        .access-toggle-btn.active { background: #fff; color: var(--orange); }

        .icon-btn {
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
            color: white; width: 30px; height: 30px; border-radius: 8px;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; flex-shrink: 0; line-height: 1;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.28); }

        /* ── Accessibility Panel — compact single row ── */
        #access-panel {
            background: #fff8f0;
            border-bottom: 2px solid #f0d5b8;
            padding: 7px 13px 8px;
            display: none; flex-wrap: nowrap; gap: 6px; align-items: center;
            flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
        }
        #access-panel::-webkit-scrollbar { display: none; }
        #access-panel.visible { display: flex; }
        .access-label { display: none; }
        .access-opt {
            background: var(--white); border: 1.5px solid #e0c0a0;
            color: var(--navy); padding: 5px 11px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600; font-family: 'Heebo', sans-serif;
            cursor: pointer; transition: all 0.18s; white-space: nowrap; flex-shrink: 0;
            display: flex; align-items: center; gap: 4px;
        }
        .access-opt:hover, .access-opt.active {
            background: var(--navy); border-color: var(--navy); color: var(--white);
        }

        /* Welcome Banner — hidden, space freed for messages */
        .welcome-banner { display: none !important; }

        /* ── Messages ── */
        #messages-container {
            flex: 1 1 0;
            min-height: 0; /* CRITICAL: allows flex child to shrink below content size */
            padding: 16px 14px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
            background: #fafbfd; scroll-behavior: smooth;
        }
        #messages-container::-webkit-scrollbar { width: 4px; }
        #messages-container::-webkit-scrollbar-thumb { background: var(--grey-mid); border-radius: 4px; }

        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; }
        .msg-wrapper.user-wrapper { flex-direction: row-reverse; }
        .msg-avatar-small {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .msg-avatar-small svg { width: 14px; height: 14px; fill: white; }
        .msg {
            max-width: 78%; padding: 10px 14px; border-radius: 16px;
            font-size: 13.5px; line-height: 1.55;
            animation: msgIn 0.25s cubic-bezier(.34,1.36,.64,1);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .bot-msg {
            background: var(--white); color: var(--text);
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm); border: 1px solid rgba(0,45,98,0.06);
        }
        .user-msg {
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            color: var(--white); border-bottom-left-radius: 4px;
            box-shadow: 0 4px 14px rgba(0,45,98,0.25);
        }
        .error-msg { background: #fff3f0; border: 1px solid #fdd; color: #c0392b; }

        /* Typing */
        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; align-items: center; }
        .typing-dot {
            width: 7px; height: 7px; background: var(--grey-mid); border-radius: 50%;
            animation: typingBounce 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%,60%,100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* ── Quick Actions — single scrollable pill row, never grows ── */
        .shortcuts-section {
            background: var(--white);
            border-top: 1px solid var(--grey-light);
            flex-shrink: 0;
            padding: 8px 12px 10px;
        }
        .shortcuts-label {
            font-size: 9.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.7px; color: var(--text-muted);
            margin-bottom: 7px;
        }
        .shortcuts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .shortcut-btn {
            background: var(--off-white); border: 1.5px solid var(--grey-light);
            color: var(--navy); padding: 7px 8px; border-radius: 20px;
            font-size: 12px; font-weight: 600; font-family: 'Heebo', sans-serif;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(.34,1.36,.64,1);
            display: flex; align-items: center; justify-content: center; gap: 4px;
            width: 100%;
        }
        .shortcut-btn:hover {
            background: var(--navy); border-color: var(--navy); color: var(--white);
            transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,45,98,0.22);
        }
        .btn-icon { font-size: 13px; flex-shrink: 0; }

        /* ── Input ── */
        .input-area {
            padding: 9px 12px; background: var(--white);
            border-top: 1px solid var(--grey-light);
            display: flex; gap: 8px; align-items: center;
            flex-shrink: 0; flex-grow: 0;
        }
        #user-input {
            flex: 1; padding: 10px 14px;
            border: 1.5px solid var(--grey-light); border-radius: 22px; outline: none;
            font-family: 'Heebo', sans-serif; font-size: 13.5px; color: var(--text);
            background: var(--off-white); transition: border-color 0.2s, box-shadow 0.2s;
        }
        #user-input:focus {
            border-color: var(--navy-light); background: var(--white);
            box-shadow: 0 0 0 3px rgba(0,79,159,0.08);
        }
        #user-input::placeholder { color: var(--text-muted); }
        #send-btn {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            border: none; border-radius: 50%; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
            box-shadow: 0 3px 10px rgba(0,45,98,0.28);
        }
        #send-btn:hover { transform: scale(1.1); box-shadow: 0 5px 16px rgba(0,45,98,0.38); }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #send-btn svg { width: 18px; height: 18px; fill: white; }

        .chat-footer-credit {
            text-align: center; padding: 3px; font-size: 10px;
            color: var(--grey-mid); background: var(--white);
            flex-shrink: 0;
        }
        .chat-footer-credit a { color: var(--navy-light); text-decoration: none; }

        @media (max-width: 480px) {
            #chat-window { right: 12px; width: calc(100vw - 24px); }
            #chat-bubble { right: 18px; }
        }

        /* ── Action Buttons inside messages ── */
        .msg-actions {
            display: flex; flex-direction: column; gap: 7px;
            margin-top: 10px;
        }
        .msg-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 16px; border-radius: 12px;
            font-size: 13px; font-weight: 600; font-family: 'Heebo', sans-serif;
            cursor: pointer; text-decoration: none;
            border: none; width: 100%; text-align: right;
            transition: all 0.18s cubic-bezier(.34,1.36,.64,1);
        }
        .msg-btn-link {
            background: linear-gradient(135deg, #eef4ff, #e8f0fe);
            color: var(--navy);
            border: 1.5px solid rgba(0,79,159,0.2);
        }
        .msg-btn-link:hover {
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            color: white; border-color: transparent;
            transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,45,98,0.25);
        }
        .msg-btn-nav {
            background: linear-gradient(135deg, #fff8f5, #fff0ea);
            color: var(--navy);
            border: 1.5px solid rgba(232,96,28,0.25);
        }
        .msg-btn-nav:hover {
            background: linear-gradient(135deg, var(--orange), #c04e0e);
            color: white; border-color: transparent;
            transform: translateY(-1px); box-shadow: 0 6px 16px rgba(232,96,28,0.3);
        }
        .msg-btn-phone {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7);
            color: #166534;
            border: 1.5px solid rgba(22,101,52,0.2);
        }
        .msg-btn-phone:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white; border-color: transparent;
            transform: translateY(-1px); box-shadow: 0 6px 16px rgba(22,163,74,0.3);
        }
        .msg-btn-icon { font-size: 15px; flex-shrink: 0; }
        .msg-btn-nav-wrap { display: flex; gap: 7px; width: 100%; }
        .msg-btn-nav-wrap .msg-btn-nav { flex: 1; justify-content: center; }
    </style>
</head>
<body>

    <!-- Floating Bubble -->
    <div id="chat-bubble" onclick="toggleChat()" role="button" aria-label="פתח עוזר צ'אט">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.524 3.656 1.435 5.163L2 22l4.837-1.435A9.956 9.956 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>

    <!-- Chat Window -->
    <div id="chat-window" role="dialog" aria-label="עוזר ארגון נכי צה&quot;ל">

        <!-- Header -->
        <div class="chat-header">
            <div class="header-brand">
                <div class="header-avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>
                </div>
                <div>
                    <div class="header-title" id="header-title">ארגון נכי צה"ל</div>
                    <div class="header-subtitle">
                        <span class="status-dot"></span>
                        <span id="header-subtitle">פעיל ומוכן לעזור</span>
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <select id="lang-selector" onchange="changeLang()" aria-label="בחר שפה">
                    <option value="he">עברית</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                    <option value="am">አማርኛ</option>
                </select>
                <!-- Accessibility button — orange and clearly visible -->
                <button class="access-toggle-btn" id="access-toggle" onclick="toggleAccessPanel()" title="נגישות" aria-label="אפשרויות נגישות" aria-expanded="false">
                    &#9855;
                </button>
                <button class="icon-btn" onclick="toggleChat()" aria-label="סגור">&#215;</button>
            </div>
        </div>

        <!-- Accessibility Panel -->
        <div id="access-panel" role="region" aria-label="אפשרויות נגישות">
            <div class="access-label" id="access-title">&#9855; נגישות</div>
            <button class="access-opt" id="btn-large" onclick="toggleLargeText()" aria-pressed="false">
                &#128210; <span id="txt-large">טקסט גדול</span>
            </button>
            <button class="access-opt" id="btn-contrast" onclick="toggleHighContrast()" aria-pressed="false">
                &#9680; <span id="txt-contrast">ניגודיות גבוהה</span>
            </button>
            <button class="access-opt" id="btn-voice" onclick="toggleVoice()" aria-pressed="false">
                &#128266; <span id="txt-voice">קריאה קולית</span>
            </button>
            <button class="access-opt" onclick="resetAccess()" id="btn-reset">
                &#8635; <span id="txt-reset">איפוס</span>
            </button>
        </div>

        <!-- Welcome Banner -->
        <div class="welcome-banner">
            <div class="welcome-icon">&#128737;</div>
            <div class="welcome-text" id="welcome-text">
                <strong id="welcome-strong">ברוכים הבאים לארגון נכי צה"ל</strong><br>
                <span id="welcome-sub">אני כאן כדי לעזור לך למצוא מידע על זכויות, הלוואות, מלגות ועוד.</span>
            </div>
        </div>

        <!-- Messages -->
        <div id="messages-container" role="log" aria-live="polite" aria-atomic="false"></div>

        <!-- Quick Actions -->
        <div class="shortcuts-section">
            <div class="shortcuts-label" id="shortcuts-label">נושאים פופולריים</div>
            <div class="shortcuts-grid" id="shortcuts-grid">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <input type="text" id="user-input" onkeypress="handleKey(event)" autocomplete="off" aria-label="הקלד הודעה">
            <button id="send-btn" onclick="sendMessage()" aria-label="שלח">
                <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
            </button>
        </div>

        <div class="chat-footer-credit">
            <span id="footer-text">מופעל על ידי</span>
            <a href="https://www.inz.org.il" target="_blank" rel="noopener">ארגון נכי צה"ל</a>
            &middot; AI Assistant
        </div>
    </div>

    <script>
    // ── Language Definitions ──
    const LANGS = {
        he: {
            dir: 'rtl', lang: 'he',
            greeting: 'שלום! אני העוזר החכם של ארגון נכי צה"ל. מה תרצה לדעת היום? &#128075;',
            headerTitle: 'ארגון נכי צה"ל',
            headerSubtitle: 'פעיל ומוכן לעזור',
            welcomeStrong: 'ברוכים הבאים לארגון נכי צה"ל',
            welcomeSub: 'אני כאן כדי לעזור לך למצוא מידע על זכויות, הלוואות, מלגות ועוד.',
            placeholder: 'שאל אותי משהו...',
            shortcutsLabel: 'נושאים פופולריים',
            accessTitle: '&#9855; נגישות',
            txtLarge: 'טקסט גדול',
            txtContrast: 'ניגודיות גבוהה',
            txtVoice: 'קריאה קולית',
            txtReset: 'איפוס',
            footerText: 'מופעל על ידי',
            connError: 'אירעה שגיאה בחיבור. אנא נסה שוב.',
            shortcuts: [
                { icon: '&#128176;', label: 'הלוואות', query: 'ספר לי על הלוואות' },
                { icon: '&#127891;', label: 'מלגות', query: 'מידע על מלגות לימודים' },
                { icon: '&#127968;', label: 'בתי הלוחם', query: 'איפה בית הלוחם הקרוב אלי?' },
                { icon: '&#128209;', label: 'זכויות', query: 'מהן הזכויות שלי?' },
                { icon: '&#127973;', label: 'ביטוחים', query: 'מידע על ביטוחים' },
                { icon: '&#128737;', label: 'חרבות ברזל', query: 'מידע לפצועי חרבות ברזל' },

    let currentLang = 'he';
    let chatHistory = [];
    let voiceEnabled = false;

    function getLang() { return LANGS[currentLang]; }

    // ── Apply full UI language ──
    function applyLang(code) {
        currentLang = code;
        const L = getLang();
        const root = document.getElementById('html-root');
        root.setAttribute('lang', L.lang);
        root.setAttribute('dir', L.dir);

        // Header
        document.getElementById('header-title').textContent = L.headerTitle;
        document.getElementById('header-subtitle').innerHTML = L.headerSubtitle;

        // Welcome banner
        document.getElementById('welcome-strong').textContent = L.welcomeStrong;
        document.getElementById('welcome-sub').textContent = L.welcomeSub;

        // Input placeholder
        document.getElementById('user-input').placeholder = L.placeholder;

        // Shortcuts label
        document.getElementById('shortcuts-label').textContent = L.shortcutsLabel;

        // Accessibility panel
        document.getElementById('access-title').innerHTML = L.accessTitle;
        document.getElementById('txt-large').textContent = L.txtLarge;
        document.getElementById('txt-contrast').textContent = L.txtContrast;
        document.getElementById('txt-voice').textContent = L.txtVoice;
        document.getElementById('txt-reset').textContent = L.txtReset;

        // Footer
        document.getElementById('footer-text').textContent = L.footerText;

        // Shortcuts grid
        const grid = document.getElementById('shortcuts-grid');
        grid.innerHTML = '';
        L.shortcuts.forEach(s => {
            const btn = document.createElement('button');
            btn.className = 'shortcut-btn';
            btn.innerHTML = `<span class="btn-icon">${s.icon}</span> ${s.label}`;
            btn.onclick = () => ask(s.query);
            grid.appendChild(btn);
        });
    }

    function changeLang() {
        const code = document.getElementById('lang-selector').value;
        applyLang(code);

        // Reset messages with greeting in new language
        document.getElementById('messages-container').innerHTML = '';
        chatHistory = [];

        // Inject a hidden user+assistant exchange that locks the AI into the chosen language
        const langNames = { he: 'Hebrew', en: 'English', es: 'Spanish', ru: 'Russian', ar: 'Arabic', am: 'Amharic' };
        const langName = langNames[code] || 'Hebrew';
        chatHistory.push({ role: 'user',      content: `Please respond only in ${langName} from now on.` });
        chatHistory.push({ role: 'assistant', content: `Understood. I will respond only in ${langName}.` });

        const greetingText = getLang().greeting.replace(/&#\d+;/g, '').replace(/&[a-z]+;/g, '').trim();
        addMessage(getLang().greeting, 'bot-msg');
        chatHistory.push({ role: 'assistant', content: greetingText });
    }

    // ── Chat ──
    function toggleChat() {
        const win = document.getElementById('chat-window');
        const bubble = document.getElementById('chat-bubble');
        const isOpen = win.style.display === 'flex';
        if (!isOpen) {
            win.style.display = 'flex';
            win.style.animation = 'none';
            win.offsetHeight;
            win.style.animation = 'slideUp 0.3s cubic-bezier(.34,1.36,.64,1)';
            bubble.classList.add('open');
            if (chatHistory.length === 0) {
                const code = document.getElementById('lang-selector').value || 'he';
                const langNames = { he: 'Hebrew', en: 'English', es: 'Spanish', ru: 'Russian', ar: 'Arabic', am: 'Amharic' };
                const langName = langNames[code] || 'Hebrew';
                chatHistory.push({ role: 'user',      content: `Please respond only in ${langName} from now on.` });
                chatHistory.push({ role: 'assistant', content: `Understood. I will respond only in ${langName}.` });
                const greetingText = getLang().greeting.replace(/&#\d+;/g, '').replace(/&[a-z]+;/g, '').trim();
                addMessage(getLang().greeting, 'bot-msg');
                chatHistory.push({ role: 'assistant', content: greetingText });
            }
            setTimeout(() => document.getElementById('user-input').focus(), 320);
        } else {
            win.style.display = 'none';
            bubble.classList.remove('open');
        }
    }

    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
    function ask(text) { document.getElementById('user-input').value = text; sendMessage(); }

    // ── Parse bot response into text + action buttons ──
    function parseButtons(text) {
        const actions = [];

        // Extract [BTN]label|url[/BTN]
        text = text.replace(/\[BTN\](.*?)\|(.*?)\[\/BTN\]/gs, (_, label, url) => {
            actions.push({ type: 'link', label: label.trim(), url: url.trim() });
            return '';
        });

        // Extract [NAV]name|gmaps|waze[/NAV]
        text = text.replace(/\[NAV\](.*?)\|(.*?)\|(.*?)\[\/NAV\]/gs, (_, name, gmaps, waze) => {
            actions.push({ type: 'nav', name: name.trim(), gmaps: gmaps.trim(), waze: waze.trim() });
            return '';
        });

        // Extract [PHONE]number[/PHONE]
        text = text.replace(/\[PHONE\](.*?)\[\/PHONE\]/gs, (_, num) => {
            actions.push({ type: 'phone', num: num.trim() });
            return '';
        });

        // Clean up leftover raw URLs
        text = text.replace(/https?:\/\/\S+/g, '');

        return { text: text.trim(), actions };
    }

    function renderBotContent(raw) {
        const { text, actions } = parseButtons(raw);
        const frag = document.createElement('div');

        // Render text paragraphs
        if (text) {
            text.split(/

+/).forEach(p => {
                p = p.replace(/
/g, ' ').trim();
                if (p) {
                    const el = document.createElement('p');
                    el.style.cssText = 'margin:0 0 8px;line-height:1.6;';
                    el.textContent = p;
                    frag.appendChild(el);
                }
            });
        }

        // Render action buttons
        if (actions.length > 0) {
            const actDiv = document.createElement('div');
            actDiv.className = 'msg-actions';

            actions.forEach(a => {
                if (a.type === 'link') {
                    const btn = document.createElement('a');
                    btn.className = 'msg-btn msg-btn-link';
                    btn.href = a.url;
                    btn.target = '_blank';
                    btn.rel = 'noopener';
                    btn.innerHTML = '<span class="msg-btn-icon">🔗</span>' + a.label;
                    actDiv.appendChild(btn);
                } else if (a.type === 'nav') {
                    const wrap = document.createElement('div');
                    wrap.className = 'msg-btn-nav-wrap';
                    const g = document.createElement('a');
                    g.className = 'msg-btn msg-btn-nav';
                    g.href = a.gmaps; g.target = '_blank'; g.rel = 'noopener';
                    g.innerHTML = '<span class="msg-btn-icon">🗺️</span> Google Maps';
                    const w = document.createElement('a');
                    w.className = 'msg-btn msg-btn-nav';
                    w.href = a.waze; w.target = '_blank'; w.rel = 'noopener';
                    w.innerHTML = '<span class="msg-btn-icon">🚗</span> Waze';
                    wrap.appendChild(g);
                    wrap.appendChild(w);
                    if (a.name) {
                        const lbl = document.createElement('div');
                        lbl.style.cssText = 'font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:600;';
                        lbl.textContent = '📍 ' + a.name;
                        actDiv.appendChild(lbl);
                    }
                    actDiv.appendChild(wrap);
                } else if (a.type === 'phone') {
                    const btn = document.createElement('a');
                    btn.className = 'msg-btn msg-btn-phone';
                    btn.href = 'tel:' + a.num.replace(/-/g,'');
                    btn.innerHTML = '<span class="msg-btn-icon">📞</span>' + a.num;
                    actDiv.appendChild(btn);
                }
            });

            frag.appendChild(actDiv);
        }

        return frag;
    }

    function addMessage(html, type) {
        const container = document.getElementById('messages-container');
        const wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper' + (type === 'user-msg' ? ' user-wrapper' : '');

        if (type !== 'user-msg') {
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar-small';
            avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>';
            wrapper.appendChild(avatar);
        }
        const div = document.createElement('div');
        div.className = 'msg ' + type;

        if (type === 'bot-msg') {
            div.appendChild(renderBotContent(html));
        } else {
            div.textContent = html;
        }

        wrapper.appendChild(div);
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;

        if (type === 'bot-msg') speak(div.textContent);
    }

    function showTyping() {
        const c = document.getElementById('messages-container');
        const w = document.createElement('div');
        w.className = 'msg-wrapper'; w.id = 'typing-wrapper';
        const a = document.createElement('div');
        a.className = 'msg-avatar-small';
        a.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>';
        const t = document.createElement('div');
        t.className = 'msg bot-msg typing-indicator';
        t.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
        w.appendChild(a); w.appendChild(t);
        c.appendChild(w); c.scrollTop = c.scrollHeight;
    }
    function hideTyping() { const el = document.getElementById('typing-wrapper'); if (el) el.remove(); }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, 'user-msg');
        input.value = '';
        chatHistory.push({ role: 'user', content: text });
        showTyping();
        document.getElementById('send-btn').disabled = true;
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: chatHistory })
            });
            const data = await res.json();
            hideTyping();
            addMessage(data.reply, 'bot-msg');
            chatHistory.push({ role: 'assistant', content: data.reply });
        } catch (e) {
            hideTyping();
            addMessage(getLang().connError, 'error-msg');
        } finally {
            document.getElementById('send-btn').disabled = false;
        }
    }

    // ── Accessibility ──
    function toggleAccessPanel() {
        const panel = document.getElementById('access-panel');
        const btn = document.getElementById('access-toggle');
        const open = panel.classList.toggle('visible');
        btn.classList.toggle('active', open);
        btn.setAttribute('aria-expanded', open);
    }
    function toggleLargeText() {
        const on = document.body.classList.toggle('large-text');
        document.getElementById('btn-large').classList.toggle('active', on);
        document.getElementById('btn-large').setAttribute('aria-pressed', on);
    }
    function toggleHighContrast() {
        const on = document.body.classList.toggle('high-contrast');
        document.getElementById('btn-contrast').classList.toggle('active', on);
        document.getElementById('btn-contrast').setAttribute('aria-pressed', on);
    }
    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        document.getElementById('btn-voice').classList.toggle('active', voiceEnabled);
        document.getElementById('btn-voice').setAttribute('aria-pressed', voiceEnabled);
        if (voiceEnabled) speak(currentLang === 'he' ? 'קריאה קולית מופעלת' : 'Voice reading enabled');
        else window.speechSynthesis && window.speechSynthesis.cancel();
    }
    function resetAccess() {
        document.body.classList.remove('large-text', 'high-contrast');
        voiceEnabled = false;
        ['btn-large','btn-contrast','btn-voice'].forEach(id => {
            document.getElementById(id).classList.remove('active');
            document.getElementById(id).setAttribute('aria-pressed', 'false');
        });
    }
    function speak(text) {
        if (!voiceEnabled || !window.speechSynthesis) return;
        const langMap = { he:'he-IL', en:'en-US', es:'es-ES', ru:'ru-RU', ar:'ar-SA', am:'am-ET' };
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = langMap[currentLang] || 'he-IL';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utt);
    }

    // Init
    applyLang('he');
