<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INZ | עוזר חכם</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #002d62;
            --navy-mid: #003d7a;
            --navy-light: #004f9f;
            --orange: #e8601c;
            --white: #ffffff;
            --off-white: #f7f8fa;
            --grey-light: #edf0f5;
            --grey-mid: #c8cfd8;
            --text: #1a2332;
            --text-muted: #5a6478;
            --shadow-sm: 0 2px 8px rgba(0,45,98,0.08);
            --shadow-lg: 0 20px 60px rgba(0,45,98,0.20);
            --radius: 16px;
            --radius-sm: 10px;
        }

        /* Accessibility modes */
        body.large-text .msg,
        body.large-text .shortcut-btn,
        body.large-text #user-input,
        body.large-text .welcome-text { font-size: 1.15rem !important; }

        body.high-contrast { --navy: #000080; --navy-light: #0000cc; --off-white: #ffffff; --text: #000000; --text-muted: #333333; }
        body.high-contrast .bot-msg { background: #fff; border: 2px solid #000; color: #000; }
        body.high-contrast .user-msg { background: #000080; color: #fff; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Heebo', sans-serif; background: var(--off-white); color: var(--text); direction: rtl; }

        /* Floating Bubble */
        #chat-bubble {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 74px;
            height: 74px;
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,45,98,0.35), 0 0 0 0 rgba(0,79,159,0.4);
            z-index: 1000;
            transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
            animation: pulse-ring 3s ease-out infinite;
        }
        #chat-bubble:hover { transform: scale(1.08); }
        @keyframes pulse-ring {
            0%   { box-shadow: 0 4px 20px rgba(0,45,98,0.35), 0 0 0 0 rgba(0,79,159,0.4); }
            60%  { box-shadow: 0 4px 20px rgba(0,45,98,0.35), 0 0 0 16px rgba(0,79,159,0); }
            100% { box-shadow: 0 4px 20px rgba(0,45,98,0.35), 0 0 0 0 rgba(0,79,159,0); }
        }
        #chat-bubble svg { width: 34px; height: 34px; fill: var(--white); }
        #chat-bubble::after {
            content: '';
            position: absolute;
            top: 5px; left: 5px;
            width: 14px; height: 14px;
            background: var(--orange);
            border-radius: 50%;
            border: 2px solid var(--white);
        }
        #chat-bubble.open::after { display: none; }

        /* Chat Window */
        #chat-window {
            position: fixed;
            bottom: 116px;
            right: 28px;
            width: 400px;
            max-width: calc(100vw - 40px);
            height: 630px;
            max-height: calc(100vh - 150px);
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            z-index: 999;
            overflow: hidden;
            border: 1px solid rgba(0,45,98,0.08);
            transform-origin: bottom right;
            animation: slideUp 0.3s cubic-bezier(.34,1.36,.64,1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .chat-header::before {
            content: '';
            position: absolute;
            top: -30px; left: -30px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.04);
            border-radius: 50%;
        }
        .header-brand { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
        .header-avatar {
            width: 38px; height: 38px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1.5px solid rgba(255,255,255,0.25);
            flex-shrink: 0;
        }
        .header-avatar svg { width: 20px; height: 20px; fill: white; }
        .header-title { color: var(--white); font-size: 14.5px; font-weight: 700; }
        .header-subtitle {
            color: rgba(255,255,255,0.65);
            font-size: 11px;
            display: flex; align-items: center; gap: 5px;
            margin-top: 2px;
        }
        .status-dot {
            width: 6px; height: 6px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(74,222,128,0.3);
            display: inline-block;
        }
        .header-controls { display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }

        #lang-selector {
            background: var(--white);
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--navy);
            padding: 4px 7px;
            border-radius: 8px;
            font-size: 11px;
            font-family: 'Heebo', sans-serif;
            font-weight: 700;
            cursor: pointer;
        }
        #lang-selector option { background: var(--white); color: var(--navy); }

        .icon-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            width: 30px; height: 30px;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.28); }

        /* Accessibility Panel */
        #access-panel {
            background: #f0f4ff;
            border-bottom: 1px solid #dce6f7;
            padding: 10px 14px;
            display: none;
            flex-wrap: wrap;
            gap: 7px;
            align-items: center;
            flex-shrink: 0;
        }
        #access-panel.visible { display: flex; }
        .access-label {
            font-size: 10.5px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--navy); width: 100%; margin-bottom: 1px;
        }
        .access-opt {
            background: var(--white);
            border: 1.5px solid #c5d5ee;
            color: var(--navy);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px; font-weight: 600;
            font-family: 'Heebo', sans-serif;
            cursor: pointer;
            transition: all 0.18s;
            display: flex; align-items: center; gap: 5px;
        }
        .access-opt:hover, .access-opt.active {
            background: var(--navy);
            border-color: var(--navy);
            color: var(--white);
        }

        /* Welcome Banner */
        .welcome-banner {
            background: linear-gradient(135deg, #eef4ff 0%, #f5f0ff 100%);
            border-bottom: 1px solid var(--grey-light);
            padding: 11px 16px;
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .welcome-icon { font-size: 20px; }
        .welcome-text { font-size: 12px; color: var(--text-muted); font-weight: 500; line-height: 1.45; }
        .welcome-text strong { color: var(--navy); font-weight: 700; }

        /* Messages */
        #messages-container {
            flex: 1;
            padding: 14px 12px;
            overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
            background: #fafbfd;
            scroll-behavior: smooth;
        }
        #messages-container::-webkit-scrollbar { width: 4px; }
        #messages-container::-webkit-scrollbar-thumb { background: var(--grey-mid); border-radius: 4px; }

        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; }
        .msg-wrapper.user-wrapper { flex-direction: row-reverse; }
        .msg-avatar-small {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .msg-avatar-small svg { width: 14px; height: 14px; fill: white; }

        .msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.55;
            animation: msgIn 0.25s cubic-bezier(.34,1.36,.64,1);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .bot-msg {
            background: var(--white); color: var(--text);
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,45,98,0.06);
        }
        .user-msg {
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            color: var(--white);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 14px rgba(0,45,98,0.25);
        }
        .error-msg { background: #fff3f0; border: 1px solid #fdd; color: #c0392b; }

        /* Typing */
        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; align-items: center; }
        .typing-dot {
            width: 7px; height: 7px;
            background: var(--grey-mid); border-radius: 50%;
            animation: typingBounce 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* Quick Actions */
        .shortcuts-section {
            padding: 10px 13px 8px;
            background: var(--white);
            border-top: 1px solid var(--grey-light);
            flex-shrink: 0;
        }
        .shortcuts-label {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.8px;
            color: var(--text-muted); margin-bottom: 7px;
        }
        .shortcuts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .shortcut-btn {
            background: var(--off-white);
            border: 1.5px solid var(--grey-light);
            color: var(--navy);
            padding: 8px 10px;
            border-radius: var(--radius-sm);
            font-size: 12px; font-weight: 600;
            font-family: 'Heebo', sans-serif;
            cursor: pointer; text-align: right;
            transition: all 0.18s cubic-bezier(.34,1.36,.64,1);
            display: flex; align-items: center; gap: 6px;
        }
        .shortcut-btn:hover {
            background: var(--navy); border-color: var(--navy); color: var(--white);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,45,98,0.2);
        }
        .btn-icon { font-size: 14px; flex-shrink: 0; }

        /* Input */
        .input-area {
            padding: 11px 13px;
            background: var(--white);
            border-top: 1px solid var(--grey-light);
            display: flex; gap: 8px; align-items: center;
            flex-shrink: 0;
        }
        #user-input {
            flex: 1; padding: 10px 14px;
            border: 1.5px solid var(--grey-light);
            border-radius: 22px; outline: none;
            font-family: 'Heebo', sans-serif;
            font-size: 13.5px; color: var(--text);
            background: var(--off-white);
            transition: border-color 0.2s, box-shadow 0.2s;
            direction: rtl;
        }
        #user-input:focus {
            border-color: var(--navy-light);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(0,79,159,0.08);
        }
        #user-input::placeholder { color: var(--text-muted); }

        #send-btn {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--navy-light), var(--navy));
            border: none; border-radius: 50%; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
            box-shadow: 0 3px 10px rgba(0,45,98,0.28);
        }
        #send-btn:hover { transform: scale(1.1); box-shadow: 0 5px 16px rgba(0,45,98,0.38); }
        #send-btn svg { width: 18px; height: 18px; fill: white; }

        .chat-footer-credit {
            text-align: center; padding: 5px;
            font-size: 10px; color: var(--grey-mid);
            background: var(--white);
        }
        .chat-footer-credit a { color: var(--navy-light); text-decoration: none; }
    </style>
</head>
<body>

    <!-- Floating Bubble -->
    <div id="chat-bubble" onclick="toggleChat()" role="button" aria-label="פתח עוזר צ'אט">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.524 3.656 1.435 5.163L2 22l4.837-1.435A9.956 9.956 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm0 18a7.95 7.95 0 01-4.163-1.165l-.298-.178-3.083.915.915-3.083-.178-.298A7.95 7.95 0 014 12c0-4.411 3.589-8 8-8s8 3.589 8 8-3.589 8-8 8z"/><path d="M8 11h8v1.5H8zm0-3h8v1.5H8zm0 6h5v1.5H8z"/></svg>
    </div>

    <!-- Chat Window -->
    <div id="chat-window" role="dialog" aria-label="עוזר ארגון נכי צה&quot;ל">

        <!-- Header -->
        <div class="chat-header">
            <div class="header-brand">
                <div class="header-avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>
                </div>
                <div>
                    <div class="header-title">ארגון נכי צה"ל</div>
                    <div class="header-subtitle">
                        <span class="status-dot"></span>
                        פעיל ומוכן לעזור
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <select id="lang-selector" onchange="changeLang()" aria-label="בחר שפה">
                    <option value="he">עברית</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                    <option value="am">አማርኛ</option>
                </select>
                <button class="icon-btn" onclick="toggleAccessPanel()" title="נגישות" aria-label="אפשרויות נגישות">&#9855;</button>
                <button class="icon-btn" onclick="toggleChat()" aria-label="סגור">&#215;</button>
            </div>
        </div>

        <!-- Accessibility Panel -->
        <div id="access-panel" role="region" aria-label="אפשרויות נגישות">
            <div class="access-label">&#9855; נגישות</div>
            <button class="access-opt" id="btn-large" onclick="toggleLargeText()" aria-pressed="false">&#128210; טקסט גדול</button>
            <button class="access-opt" id="btn-contrast" onclick="toggleHighContrast()" aria-pressed="false">&#9680; ניגודיות גבוהה</button>
            <button class="access-opt" id="btn-voice" onclick="toggleVoice()" aria-pressed="false">&#128266; קריאה קולית</button>
            <button class="access-opt" onclick="resetAccess()">&#8635; איפוס</button>
        </div>

        <!-- Welcome Banner -->
        <div class="welcome-banner">
            <div class="welcome-icon">&#128737;</div>
            <div class="welcome-text">
                <strong>ברוכים הבאים לארגון נכי צה"ל</strong><br>
                אני כאן כדי לעזור לך למצוא מידע על זכויות, הלוואות, מלגות ועוד.
            </div>
        </div>

        <!-- Messages -->
        <div id="messages-container" role="log" aria-live="polite" aria-atomic="false">
            <div class="msg-wrapper">
                <div class="msg-avatar-small">
                    <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>
                </div>
                <div class="msg bot-msg">שלום! אני העוזר החכם של ארגון נכי צה"ל. מה תרצה לדעת היום? &#128075;</div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="shortcuts-section">
            <div class="shortcuts-label">נושאים פופולריים</div>
            <div class="shortcuts-grid">
                <button class="shortcut-btn" onclick="ask('ספר לי על הלוואות')"><span class="btn-icon">&#128176;</span> הלוואות</button>
                <button class="shortcut-btn" onclick="ask('מידע על מלגות לימודים')"><span class="btn-icon">&#127891;</span> מלגות</button>
                <button class="shortcut-btn" onclick="ask('איפה בית הלוחם הקרוב אלי?')"><span class="btn-icon">&#127968;</span> בתי הלוחם</button>
                <button class="shortcut-btn" onclick="ask('מהן הזכויות שלי?')"><span class="btn-icon">&#128209;</span> זכויות</button>
                <button class="shortcut-btn" onclick="ask('מידע על ביטוחים')"><span class="btn-icon">&#127973;</span> ביטוחים</button>
                <button class="shortcut-btn" onclick="ask('מידע לפצועי חרבות ברזל')"><span class="btn-icon">&#128737;</span> חרבות ברזל</button>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="שאל אותי משהו..." onkeypress="handleKey(event)" autocomplete="off" aria-label="הקלד הודעה">
            <button id="send-btn" onclick="sendMessage()" aria-label="שלח הודעה">
                <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
            </button>
        </div>

        <div class="chat-footer-credit">מופעל על ידי <a href="https://www.inz.org.il" target="_blank" rel="noopener">ארגון נכי צה"ל</a> &middot; AI Assistant</div>
    </div>

    <script>
        let chatHistory = [
            { role: "assistant", content: 'שלום! אני העוזר החכם של ארגון נכי צה"ל. מה תרצה לדעת היום? 👋' }
        ];
        let voiceEnabled = false;

        function toggleChat() {
            const win = document.getElementById('chat-window');
            const bubble = document.getElementById('chat-bubble');
            const isOpen = win.style.display === 'flex';
            win.style.display = isOpen ? 'none' : 'flex';
            bubble.classList.toggle('open', !isOpen);
            if (!isOpen) {
                win.style.animation = 'none';
                win.offsetHeight;
                win.style.animation = 'slideUp 0.3s cubic-bezier(.34,1.36,.64,1)';
                setTimeout(() => document.getElementById('user-input').focus(), 320);
            }
        }

        function toggleAccessPanel() {
            document.getElementById('access-panel').classList.toggle('visible');
        }

        function toggleLargeText() {
            const btn = document.getElementById('btn-large');
            document.body.classList.toggle('large-text');
            const on = document.body.classList.contains('large-text');
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on);
        }

        function toggleHighContrast() {
            const btn = document.getElementById('btn-contrast');
            document.body.classList.toggle('high-contrast');
            const on = document.body.classList.contains('high-contrast');
            btn.classList.toggle('active', on);
            btn.setAttribute('aria-pressed', on);
        }

        function toggleVoice() {
            const btn = document.getElementById('btn-voice');
            voiceEnabled = !voiceEnabled;
            btn.classList.toggle('active', voiceEnabled);
            btn.setAttribute('aria-pressed', voiceEnabled);
            if (voiceEnabled) speak('קריאה קולית מופעלת');
            else window.speechSynthesis && window.speechSynthesis.cancel();
        }

        function resetAccess() {
            document.body.classList.remove('large-text', 'high-contrast');
            voiceEnabled = false;
            ['btn-large', 'btn-contrast', 'btn-voice'].forEach(id => {
                document.getElementById(id).classList.remove('active');
                document.getElementById(id).setAttribute('aria-pressed', 'false');
            });
        }

        function speak(text) {
            if (!voiceEnabled || !window.speechSynthesis) return;
            const utt = new SpeechSynthesisUtterance(text);
            const lang = document.getElementById('lang-selector').value;
            const langMap = { he: 'he-IL', en: 'en-US', es: 'es-ES', ru: 'ru-RU', ar: 'ar-SA', am: 'am-ET' };
            utt.lang = langMap[lang] || 'he-IL';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utt);
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
        function ask(text) {
            document.getElementById('user-input').value = text;
            sendMessage();
        }

        function addMessage(text, type) {
            const container = document.getElementById('messages-container');
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper' + (type === 'user-msg' ? ' user-wrapper' : '');

            if (type !== 'user-msg') {
                const avatar = document.createElement('div');
                avatar.className = 'msg-avatar-small';
                avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>';
                wrapper.appendChild(avatar);
            }

            const div = document.createElement('div');
            div.className = 'msg ' + type;
            div.innerText = text;
            wrapper.appendChild(div);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;

            if (type === 'bot-msg') speak(text);
        }

        function showTyping() {
            const container = document.getElementById('messages-container');
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper';
            wrapper.id = 'typing-wrapper';
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar-small';
            avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>';
            const typing = document.createElement('div');
            typing.className = 'msg bot-msg typing-indicator';
            typing.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            wrapper.appendChild(avatar);
            wrapper.appendChild(typing);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-wrapper');
            if (el) el.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user-msg');
            input.value = '';
            chatHistory.push({ role: "user", content: text });
            showTyping();
            document.getElementById('send-btn').disabled = true;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });
                const data = await response.json();
                hideTyping();
                addMessage(data.reply, 'bot-msg');
                chatHistory.push({ role: "assistant", content: data.reply });
            } catch (err) {
                hideTyping();
                addMessage('אירעה שגיאה בחיבור. אנא נסה שוב.', 'error-msg');
            } finally {
                document.getElementById('send-btn').disabled = false;
            }
        }

        function changeLang() {
            const lang = document.getElementById('lang-selector').value;
            const greetings = {
                he: 'שלום! אני כאן לעזור לך. מה תרצה לדעת? 👋',
                en: "Hello! I'm here to help. What would you like to know? 👋",
                es: '¡Hola! Estoy aquí para ayudarte. ¿Qué quieres saber? 👋',
                ru: 'Здравствуйте! Я здесь, чтобы помочь вам. 👋',
                ar: 'مرحباً! أنا هنا للمساعدة. ماذا تريد أن تعرف؟ 👋',
                am: 'ሰላም! እርስዎን ለመርዳት እዚህ ነኝ። ምን ማወቅ ይፈልጋሉ? 👋'
            };
            document.getElementById('messages-container').innerHTML = '';
            chatHistory = [];
            const greeting = greetings[lang] || greetings.he;
            addMessage(greeting, 'bot-msg');
            chatHistory.push({ role: "assistant", content: greeting });
        }
    </script>
</body>
</html>
