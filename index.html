<!DOCTYPE html>
<html id="html-root" lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INZ | עוזר חכם</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #1a1a2e;
            --navy-light: #16213e;
            --navy-mid: #0f3460;
            --gold: #c9a96e;
            --gold-light: #e8c98a;
            --gold-dim: rgba(201,169,110,0.18);
            --white: #ffffff;
            --off-white: #f9f7f4;
            --grey-light: #f0ece6;
            --grey-mid: #c4bdb4;
            --text: #1e1b18;
            --text-muted: #7a746c;
            --surface: #ffffff;
            --surface-warm: #fdfaf6;
            --shadow-sm: 0 2px 12px rgba(26,26,46,0.1);
            --shadow-lg: 0 24px 80px rgba(26,26,46,0.28), 0 8px 24px rgba(26,26,46,0.12);
            --radius: 20px;
            --radius-sm: 12px;
        }

        /* ── Accessibility ── */
        /* Large text: only bumps chat bubble content, never breaks layout */
        body.large-text #chat-window .msg { font-size: 15px !important; line-height: 1.7 !important; }
        body.large-text #chat-window #user-input { font-size: 15px !important; }
        /* Everything else stays fixed so it cannot overflow */
        body.large-text #chat-window .shortcut-btn,
        body.large-text #chat-window .access-opt,
        body.large-text #chat-window .shortcuts-label,
        body.large-text #chat-window .header-title,
        body.large-text #chat-window .header-subtitle,
        body.large-text #chat-window .chat-footer-credit { font-size: inherit !important; }

        body.high-contrast { --navy: #000; --navy-light: #111; --off-white: #fff; --text: #000; --text-muted: #222; --grey-light: #ccc; --gold: #cc9900; }
        body.high-contrast .bot-msg { background: #fff; border: 2px solid #000 !important; color: #000; }
        body.high-contrast .user-msg { background: #000 !important; color: #fff; }
        body.high-contrast .shortcut-btn { border: 2px solid #000 !important; }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: 'Heebo', sans-serif;
            background: transparent;
            color: var(--text);
        }

        /* Chat elements sit on top */
        #chat-bubble, #chat-window { z-index: 1000; }

        @media (max-width: 480px) {
            .hero-stats { gap: 20px; }
            .hero-stat-num { font-size: 24px; }
            #hero { justify-content: flex-start; padding-top: 80px; }
        }

        /* ── Floating Bubble ── */
        #chat-bubble {
            position: fixed;
            bottom: 28px; right: 28px;
            width: 74px; height: 74px;
            background: linear-gradient(145deg, #1a1a2e 0%, #0f3460 50%, #1a1a2e 100%);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 6px 28px rgba(26,26,46,0.5), 0 0 0 0 rgba(201,169,110,0.5), inset 0 1px 0 rgba(201,169,110,0.2);
            z-index: 1000;
            transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
            animation: pulse-ring 3s ease-out infinite;
            border: 1.5px solid rgba(201,169,110,0.35);
        }
        #chat-bubble:hover { transform: scale(1.08); }
        @keyframes pulse-ring {
            0%   { box-shadow: 0 6px 28px rgba(26,26,46,0.5), 0 0 0 0 rgba(201,169,110,0.45), inset 0 1px 0 rgba(201,169,110,0.2); }
            60%  { box-shadow: 0 6px 28px rgba(26,26,46,0.5), 0 0 0 18px rgba(201,169,110,0), inset 0 1px 0 rgba(201,169,110,0.2); }
            100% { box-shadow: 0 6px 28px rgba(26,26,46,0.5), 0 0 0 0 rgba(201,169,110,0), inset 0 1px 0 rgba(201,169,110,0.2); }
        }
        #chat-bubble svg { width: 34px; height: 34px; fill: var(--gold); }
        #chat-bubble::after {
            content: '';
            position: absolute; top: 5px; left: 5px;
            width: 14px; height: 14px;
            background: var(--gold); border-radius: 50%;
            border: 2px solid var(--navy);
        }
        #chat-bubble.open::after { display: none; }

        /* ── Chat Window ── */
        #chat-window {
            position: fixed;
            bottom: 110px; right: 28px;
            width: 430px;
            max-width: calc(100vw - 40px);
            height: min(800px, calc(100vh - 125px));
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            display: none; flex-direction: column;
            z-index: 999;
            overflow: hidden;
            border: 1px solid rgba(201,169,110,0.2);
            transform-origin: bottom right;
            animation: slideUp 0.3s cubic-bezier(.34,1.36,.64,1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: scale(0.92) translateY(12px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ── Header ── */
        .chat-header {
            background: linear-gradient(160deg, #1a1a2e 0%, #0f3460 60%, #16213e 100%);
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0; position: relative; overflow: hidden;
            border-bottom: 1px solid rgba(201,169,110,0.25);
        }
        .chat-header::before {
            content: '';
            position: absolute; top: -40px; right: -40px;
            width: 150px; height: 150px;
            background: radial-gradient(circle, rgba(201,169,110,0.12) 0%, transparent 70%);
            border-radius: 50%;
        }
        .chat-header::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,169,110,0.4), transparent);
        }
        .header-brand { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
        .header-avatar {
            width: 40px; height: 40px;
            background: rgba(201,169,110,0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1.5px solid rgba(201,169,110,0.4); flex-shrink: 0;
        }
        .header-avatar svg { width: 20px; height: 20px; fill: var(--gold); }
        .header-title { color: var(--gold-light); font-size: 14px; font-weight: 700; letter-spacing: 0.3px; }
        .header-subtitle {
            color: rgba(255,255,255,0.5); font-size: 11px;
            display: flex; align-items: center; gap: 5px; margin-top: 2px;
        }
        .status-dot {
            width: 6px; height: 6px; background: #4ade80; border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(74,222,128,0.3); display: inline-block;
            animation: blink 2s ease-in-out infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

        .header-controls { display: flex; align-items: center; gap: 6px; position: relative; z-index: 1; }
        #lang-selector {
            background: rgba(201,169,110,0.12); border: 1px solid rgba(201,169,110,0.3);
            color: var(--gold-light); padding: 4px 7px; border-radius: 8px;
            font-size: 11px; font-family: 'Heebo', sans-serif; font-weight: 700; cursor: pointer;
        }
        #lang-selector option { background: #1a1a2e; color: #e8c98a; }

        /* Accessibility button */
        .access-toggle-btn {
            background: rgba(201,169,110,0.15);
            border: 1.5px solid rgba(201,169,110,0.4);
            color: var(--gold); width: 32px; height: 32px;
            border-radius: 8px; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0; font-weight: 700;
        }
        .access-toggle-btn:hover { background: rgba(201,169,110,0.28); transform: scale(1.08); }
        .access-toggle-btn.active { background: var(--gold); color: var(--navy); }

        .icon-btn {
            background: rgba(201,169,110,0.1); border: 1px solid rgba(201,169,110,0.25);
            color: var(--gold); width: 30px; height: 30px; border-radius: 8px;
            font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; flex-shrink: 0; line-height: 1;
        }
        .icon-btn:hover { background: rgba(201,169,110,0.22); }

        /* ── Accessibility Panel — compact single row ── */
        #access-panel {
            background: #fdfaf5;
            border-bottom: 1px solid rgba(201,169,110,0.2);
            padding: 7px 13px 8px;
            display: none; flex-wrap: nowrap; gap: 6px; align-items: center;
            flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
        }
        #access-panel::-webkit-scrollbar { display: none; }
        #access-panel.visible { display: flex; }
        .access-label { display: none; }
        .access-opt {
            background: var(--white); border: 1.5px solid rgba(201,169,110,0.3);
            color: var(--text); padding: 5px 11px; border-radius: 20px;
            font-size: 11.5px; font-weight: 600; font-family: 'Heebo', sans-serif;
            cursor: pointer; transition: all 0.18s; white-space: nowrap; flex-shrink: 0;
            display: flex; align-items: center; gap: 4px;
        }
        .access-opt:hover, .access-opt.active {
            background: var(--navy); border-color: var(--navy); color: var(--gold);
        }

        /* Welcome Banner — hidden, space freed for messages */
        .welcome-banner { display: none !important; }

        /* ── Messages ── */
        #messages-container {
            flex: 1 1 0;
            min-height: 0; /* CRITICAL: allows flex child to shrink below content size */
            padding: 16px 14px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
            background: #f9f7f4; scroll-behavior: smooth;
        }
        #messages-container::-webkit-scrollbar { width: 4px; }
        #messages-container::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.3); border-radius: 4px; }

        .msg-wrapper { display: flex; gap: 8px; align-items: flex-end; }
        .msg-wrapper.user-wrapper { flex-direction: row-reverse; }
        .msg-avatar-small {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(145deg, #1a1a2e 0%, #0f3460 100%);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .msg-avatar-small svg { width: 14px; height: 14px; fill: white; }
        .msg {
            max-width: 78%; padding: 10px 14px; border-radius: 16px;
            font-size: 13.5px; line-height: 1.55;
            animation: msgIn 0.25s cubic-bezier(.34,1.36,.64,1);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        .bot-msg {
            background: var(--surface-warm); color: var(--text);
            border-bottom-right-radius: 4px;
            box-shadow: var(--shadow-sm); border: 1px solid rgba(0,45,98,0.06);
        }
        .user-msg {
            background: linear-gradient(145deg, #1a1a2e 0%, #0f3460 100%);
            color: var(--white); border-bottom-left-radius: 4px;
            box-shadow: 0 4px 14px rgba(0,45,98,0.25);
        }
        .error-msg { background: #fff3f0; border: 1px solid #fdd; color: #c0392b; }

        /* Typing */
        .typing-indicator { display: flex; gap: 4px; padding: 12px 16px; align-items: center; }
        .typing-dot {
            width: 7px; height: 7px; background: rgba(201,169,110,0.5); border-radius: 50%;
            animation: typingBounce 1.2s ease-in-out infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes typingBounce {
            0%,60%,100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* ── Quick Actions — single scrollable pill row, never grows ── */
        .shortcuts-section {
            background: var(--surface-warm);
            border-top: 1px solid rgba(201,169,110,0.15);
            border-top: 1px solid var(--grey-light);
            flex-shrink: 0;
            padding: 8px 12px 10px;
        }
        .shortcuts-label {
            font-size: 9.5px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; font-size: 10px; font-weight: 700;
            margin-bottom: 7px;
        }
        .shortcuts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .shortcut-btn {
            background: var(--white); border: 1.5px solid rgba(201,169,110,0.25);
            color: var(--text); padding: 7px 8px; border-radius: 20px;
            font-size: 12px; font-weight: 600; font-family: 'Heebo', sans-serif;
            cursor: pointer;
            transition: all 0.18s cubic-bezier(.34,1.36,.64,1);
            display: flex; align-items: center; justify-content: center; gap: 4px;
            width: 100%;
        }
        .shortcut-btn:hover {
            background: var(--navy); border-color: var(--navy); color: var(--gold);
            transform: translateY(-1px); box-shadow: 0 4px 14px rgba(0,45,98,0.22);
        }
        .btn-icon { font-size: 13px; flex-shrink: 0; }

        /* ── Input ── */
        .input-area {
            padding: 9px 12px; background: var(--surface-warm);
            border-top: 1px solid var(--grey-light);
            display: flex; gap: 8px; align-items: center;
            flex-shrink: 0; flex-grow: 0;
        }
        #user-input {
            flex: 1; padding: 10px 14px;
            border: 1.5px solid rgba(201,169,110,0.25); border-radius: 22px; outline: none;
            font-family: 'Heebo', sans-serif; font-size: 13.5px; color: var(--text);
            background: var(--surface-warm); transition: border-color 0.2s, box-shadow 0.2s;
        }
        #user-input:focus {
            border-color: rgba(201,169,110,0.5); background: var(--white);
            box-shadow: 0 0 0 3px rgba(201,169,110,0.1);
        }
        #user-input::placeholder { color: var(--text-muted); }
        #send-btn {
            width: 40px; height: 40px;
            background: linear-gradient(145deg, #c9a96e 0%, #a07840 100%);
            border: none; border-radius: 50%; color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), box-shadow 0.2s;
            box-shadow: 0 3px 10px rgba(0,45,98,0.28);
        }
        #send-btn:hover { transform: scale(1.1); box-shadow: 0 5px 16px rgba(201,169,110,0.5); }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        #send-btn svg { width: 18px; height: 18px; fill: #1a1a2e; }

        .chat-footer-credit {
            text-align: center; padding: 3px; font-size: 10px;
            color: var(--grey-mid); background: var(--surface-warm);
            border-top: 1px solid rgba(201,169,110,0.1); flex-shrink: 0;
        }
        .chat-footer-credit a { color: var(--gold); text-decoration: none; }

        @media (max-width: 480px) {
            #chat-window { right: 12px; width: calc(100vw - 24px); }
            #chat-bubble { right: 18px; }
        }

        /* ── Action Buttons inside messages ── */
        .msg-actions {
            display: flex; flex-direction: column; gap: 7px;
            margin-top: 10px;
        }
        .msg-btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 16px; border-radius: 12px;
            font-size: 13px; font-weight: 600; font-family: 'Heebo', sans-serif;
            cursor: pointer; text-decoration: none;
            border: none; width: 100%; text-align: right;
            transition: all 0.2s cubic-bezier(.34,1.36,.64,1);
        }
        .msg-btn-link {
            background: var(--surface-warm);
            color: var(--navy);
            border: 1.5px solid rgba(201,169,110,0.3);
        }
        .msg-btn-link:hover {
            background: linear-gradient(145deg, #1a1a2e, #0f3460);
            color: var(--gold); border-color: transparent;
            transform: translateY(-1px); box-shadow: 0 6px 18px rgba(26,26,46,0.22);
        }
        .msg-btn-nav {
            background: var(--surface-warm);
            color: var(--text);
            border: 1.5px solid rgba(201,169,110,0.3);
        }
        .msg-btn-nav:hover {
            transform: translateY(-1px); box-shadow: 0 6px 18px rgba(26,26,46,0.15);
            filter: brightness(0.96);
        }
        .msg-btn-phone {
            background: linear-gradient(145deg, #1a7a45, #15603a);
            color: white;
            border: none;
            font-size: 14px;
            font-weight: 700;
            justify-content: center;
            letter-spacing: 0.5px;
        }
        .msg-btn-phone:hover {
            background: linear-gradient(145deg, #15603a, #0f4a2c);
            color: white; border-color: transparent;
            transform: translateY(-1px); box-shadow: 0 6px 18px rgba(26,120,68,0.35);
        }
        .msg-btn-icon { font-size: 15px; flex-shrink: 0; }
        .msg-btn-nav-wrap { display: flex; gap: 7px; width: 100%; }
        .msg-btn-nav-wrap .msg-btn-nav { flex: 1; justify-content: center; }

        /* ── Distance Card ── */
        .dist-card {
            background: linear-gradient(145deg, #fdfaf5 0%, #f8f4ed 100%);
            border: 1.5px solid rgba(201,169,110,0.25);
            border-radius: 16px;
            padding: 16px 18px;
            margin-top: 10px;
        }
        .dist-card-header { margin-bottom: 10px; }
        .dist-card-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(201,169,110,0.12);
            color: #8a6a30;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid rgba(201,169,110,0.2);
        }
        .dist-card-sentence {
            font-size: 15px;
            line-height: 1.7;
            color: var(--text);
            margin-bottom: 14px;
        }
        .dist-highlight {
            font-weight: 800;
            color: var(--navy);
            font-size: 17px;
        }
        .dist-card-actions { display: flex; gap: 8px; }
        .dist-nav-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            border: 1.5px solid transparent;
        }
        /* Google Maps button — white with Google brand colors */
        .dist-nav-btn:not(.dist-waze) {
            background: #ffffff;
            color: #3c4043;
            border-color: #dadce0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .dist-nav-btn:not(.dist-waze):hover {
            background: #f8f9fa;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transform: translateY(-1px);
        }
        /* Waze button — Waze brand cyan/dark */
        .dist-waze {
            background: #05c8f7;
            color: #1a1a2e;
        }
        .dist-waze:hover { background: #03b0dc; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(5,200,247,0.35); }
        .dist-card-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 13px;
            padding: 4px 0;
            direction: rtl;
        }
        .dist-card-nodata { color: var(--text-muted); font-size: 13px; }
        .dist-spinner {
            width: 14px; height: 14px;
            border: 2px solid rgba(201,169,110,0.25);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Floating Bubble -->
    <div id="chat-bubble" onclick="toggleChat()" role="button" aria-label="פתח עוזר צ'אט">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.524 3.656 1.435 5.163L2 22l4.837-1.435A9.956 9.956 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
    </div>

    <!-- Chat Window -->
    <div id="chat-window" role="dialog" aria-label="עוזר ארגון נכי צה&quot;ל">

        <!-- Header -->
        <div class="chat-header">
            <div class="header-brand">
                <div class="header-avatar">
                    <svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>
                </div>
                <div>
                    <div class="header-title" id="header-title">ארגון נכי צה"ל</div>
                    <div class="header-subtitle">
                        <span class="status-dot"></span>
                        <span id="header-subtitle">פעיל ומוכן לעזור</span>
                    </div>
                </div>
            </div>
            <div class="header-controls">
                <select id="lang-selector" onchange="changeLang()" aria-label="בחר שפה">
                    <option value="he">עברית</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="ru">Русский</option>
                    <option value="ar">العربية</option>
                    <option value="am">አማርኛ</option>
                </select>
                <!-- Accessibility button — orange and clearly visible -->
                <button class="access-toggle-btn" id="access-toggle" onclick="toggleAccessPanel()" title="נגישות" aria-label="אפשרויות נגישות" aria-expanded="false">
                    &#9855;
                </button>
                <button class="icon-btn" onclick="toggleChat()" aria-label="סגור">&#215;</button>
            </div>
        </div>

        <!-- Accessibility Panel -->
        <div id="access-panel" role="region" aria-label="אפשרויות נגישות">
            <div class="access-label" id="access-title">&#9855; נגישות</div>
            <button class="access-opt" id="btn-large" onclick="toggleLargeText()" aria-pressed="false">

        const holidayCalendar = [
            { m:3,  d:13, key:'purim' }, { m:3,  d:14, key:'purim' },
            { m:4,  d:12, key:'pesach' }, { m:4,  d:13, key:'pesach' },
            { m:4,  d:18, key:'pesach' }, { m:4,  d:19, key:'pesach' },

            { m:9,  d:22, key:'roshHashana' }, { m:9,  d:23, key:'roshHashana' },
            { m:10, d:1,  key:'yomKippur' },
            { m:10, d:6,  key:'sukkot' }, { m:10, d:7, key:'sukkot' },

            { m:12, d:27, key:'hanukkah' }, { m:1, d:1, key:'hanukkah' },
            { m:1,  d:2,  key:'hanukkah' },
        ];

        const todayHolidayEntry = holidayCalendar.find(h => h.m === month && h.d === date);
        const todayHoliday = todayHolidayEntry
            ? (holidayNames[todayHolidayEntry.key][lang] || holidayNames[todayHolidayEntry.key]['en'])
            : null;

        // Time of day greetings — all 7 languages
        let timeGreet;
        if (hour >= 5 && hour < 12) {
            timeGreet = { he:'בוקר טוב', en:'Good morning', fr:'Bonjour', es:'Buenos días', ru:'Доброе утро', ar:'صباح الخير', am:'እንደምን አደሩ' };
        } else if (hour >= 12 && hour < 14) {
            timeGreet = { he:'צהריים טובים', en:'Good afternoon', fr:'Bon après-midi', es:'Buenas tardes', ru:'Добрый день', ar:'مساء النور', am:'ሰላም' };
        } else if (hour >= 14 && hour < 18) {
            timeGreet = { he:'אחר הצהריים טובים', en:'Good afternoon', fr:'Bon après-midi', es:'Buenas tardes', ru:'Добрый день', ar:'مساء النور', am:'ሰላም' };
        } else if (hour >= 18 && hour < 22) {
            timeGreet = { he:'ערב טוב', en:'Good evening', fr:'Bonsoir', es:'Buenas noches', ru:'Добрый вечер', ar:'مساء الخير', am:'እንደምን አመሻሁ' };
        } else {
            timeGreet = { he:'לילה טוב', en:'Good night', fr:'Bonne nuit', es:'Buenas noches', ru:'Доброй ночи', ar:'تصبح على خير', am:'ሌሊቱን መልካም' };
        }

        const isShabbat     = day === 6;
        const isErevShabbat = day === 5 && hour >= 14;

        // Per-language closing questions (varied)
        const closings = {
            he: ['במה אוכל לעזור לך היום?', 'איך אוכל לסייע לך?', 'מה תרצה לדעת?', 'ספר לי — במה אוכל לעזור?'],
            en: ['How can I help you today?', 'What can I do for you?', 'What would you like to know?'],
            fr: ['Comment puis-je vous aider?', 'Que puis-je faire pour vous?', 'Que souhaitez-vous savoir?'],
            es: ['¿En qué puedo ayudarle?', '¿Qué puedo hacer por usted?', '¿Qué desea saber?'],
            ru: ['Чем могу помочь?', 'Как я могу вам помочь?', 'Что вы хотите узнать?'],
            ar: ['كيف يمكنني مساعدتك؟', 'ماذا تريد أن تعرف؟', 'بماذا أستطيع مساعدتك؟'],
            am: ['እንዴት ልረዳዎ?', 'ምን ማወቅ ይፈልጋሉ?'],
        };
        const orgNames = {
            he: 'ארגון נכי צה"ל',

            fr: 'l\'Organisation des Vétérans Handicapés de Tsahal',

            ru: 'организации инвалидов ЦАХАЛа',
            ar: 'منظمة معاقي الجيش الإسرائيلي',
            am: 'IDF አካል ጉዳተኞች ድርጅት',
        };
        const thankYou = {
            he: 'תודה על שירותך — אנחנו כאן בשבילך.',
            en: 'Thank you for your service — we\'re here for you.',
            fr: 'Merci pour votre service — nous sommes là pour vous.',
            es: 'Gracias por su servicio — estamos aquí para usted.',
            ru: 'Спасибо за вашу службу — мы здесь для вас.',
            ar: 'شكراً لخدمتك — نحن هنا من أجلك.',
            am: 'አገልግሎትዎ ያስመሰግናል — እዚህ ለእርስዎ ነን።',
        };
        const assistantLine = {
            he: `אני העוזר החכם של ${orgNames['he']}.`,
            en: `I'm the smart assistant of the ${orgNames['en']}.`,
            fr: `Je suis l’assistant intelligent de ${orgNames['fr']}.`,
            es: `Soy el asistente de ${orgNames['es']}.`,
            ru: `Я помощник ${orgNames['ru']}.`,
            ar: `أنا المساعد الذكي لـ${orgNames['ar']}.`,
            am: `የ${orgNames['am']} ብልህ ረዳት ነኝ።`,
        };

        const c = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const greet = timeGreet[lang] || timeGreet['en'];
        const closing = c(closings[lang] || closings['en']);

        let lines = [];

        if (todayHoliday) {
            lines.push(todayHoliday);
        } else if (isShabbat) {
            lines.push(shabbatGreet[lang] || shabbatGreet['en']);
        } else if (isErevShabbat) {
            lines.push(erevShabbatGreet[lang] || erevShabbatGreet['en']);
        }

        lines.push(`${greet} 👋`);
        lines.push(`${assistantLine[lang] || assistantLine['en']} ${thankYou[lang] || thankYou['en']}`);
        lines.push(closing);

        return lines.join('\n');
    }

    // ── Parse bot response into text + action buttons ──
    function parseButtons(text) {
        const actions = [];

        // Extract [NAV]name|gmaps_url|waze_url[/NAV]
        text = text.replace(/\[NAV\](.*?)\[\/NAV\]/gs, (_, content) => {
            const parts = content.split('|');
            actions.push({ type: 'nav', name: (parts[0]||'').trim(), gurl: (parts[1]||'').trim(), wurl: (parts[2]||'').trim() });
            return '';
        });

        // Extract [BTN]label|url[/BTN]
        text = text.replace(/\[BTN\](.*?)\|(.*?)\[\/BTN\]/gs, (_, label, url) => {
            actions.push({ type: 'link', label: label.trim(), url: url.trim() });
            return '';
        });

        // Extract [PHONE]number[/PHONE]
        text = text.replace(/\[PHONE\](.*?)\[\/PHONE\]/gs, (_, num) => {
            actions.push({ type: 'phone', num: num.trim() });
            return '';
        });

        // Extract [DIST]origin|facility[/DIST]
        text = text.replace(/\[DIST\](.*?)\|(.*?)\[\/DIST\]/gs, (_, origin, facility) => {
            actions.push({ type: 'dist', origin: origin.trim(), facility: facility.trim() });
            return '';
        });

        // Clean up leftover raw URLs
        text = text.replace(/https?:\/\/\S+/g, '');

        return { text: text.trim(), actions };
    }

    async function fetchDistance(origin, facility) {
        try {
            const resp = await fetch('/api/distance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ origin, facility })
            });
            if (!resp.ok) return null;
            return await resp.json();
        } catch { return null; }
    }

                card.innerHTML = `<div class="dist-card-nodata">${L.distError}</div>`;

    function renderBotContent(raw) {
        const { text, actions } = parseButtons(raw);
        const frag = document.createElement('div');

        // Render text paragraphs
        if (text) {
            text.split(/\n\n+/).forEach(p => {
                p = p.replace(/\n/g, ' ').trim();
                if (p) {
                    const el = document.createElement('p');
                    el.style.cssText = 'margin:0 0 8px;line-height:1.6;';
                    el.textContent = p;
                    frag.appendChild(el);
                }
            });
        }

        // Render action buttons
        if (actions.length > 0) {
            const actDiv = document.createElement('div');
            actDiv.className = 'msg-actions';

            actions.forEach(a => {
                if (a.type === 'link') {
                    const btn = document.createElement('a');
                    btn.className = 'msg-btn msg-btn-link';
                    btn.href = a.url;
                    btn.target = '_blank';
                    btn.rel = 'noopener';
                    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="flex-shrink:0;opacity:0.6"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>` + a.label;
                    actDiv.appendChild(btn);
                } else if (a.type === 'nav') {
                    const wrap = document.createElement('div');
                    wrap.className = 'msg-btn-nav-wrap';
                    const gb = document.createElement('a');
                    gb.className = 'msg-btn msg-btn-nav';
                    gb.href = a.gurl; gb.target = '_blank'; gb.rel = 'noopener';
                    gb.innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" fill="#EA4335"/><path d="M12 2C8.13 2 5 5.13 5 9c0 1.9.72 3.63 1.9 4.93L12 2z" fill="#FBBC05"/><path d="M12 2l4.1 11.93C17.28 12.63 19 10.9 19 9c0-3.87-3.13-7-7-7z" fill="#4285F4"/><circle cx="12" cy="9" r="2.5" fill="white"/></svg>${getLang().navGoogle || 'Google Maps'}`;
                    const wb = document.createElement('a');
                    wb.className = 'msg-btn msg-btn-nav dist-waze';
                    wb.href = a.wurl; wb.target = '_blank'; wb.rel = 'noopener';
                    wb.innerHTML = `<svg width="19" height="17" viewBox="0 0 64 56" fill="none" style="flex-shrink:0"><ellipse cx="32" cy="28" rx="30" ry="26" fill="#05C8F7"/><path d="M18 30c0-8 6.27-14 14-14s14 6 14 14c0 5-2.5 9.4-6.3 12l2.3 4H22l2.3-4C20.5 39.4 18 35 18 30z" fill="white"/><circle cx="26" cy="30" r="2.5" fill="#333"/><circle cx="38" cy="30" r="2.5" fill="#333"/><path d="M26 38 Q32 42 38 38" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/></svg>${getLang().navWaze || 'Waze'}`;
                    wrap.appendChild(gb); wrap.appendChild(wb);
                    actDiv.appendChild(wrap);
                } else if (a.type === 'phone') {
                    const btn = document.createElement('a');
                    btn.className = 'msg-btn msg-btn-phone';
                    btn.href = 'tel:' + a.num.replace(/-/g,'');
                    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="flex-shrink:0"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.84 3.91 19.79 19.79 0 016.88 5.26a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 13a16 16 0 006.29 6.29l1.1-1.1a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>` + a.num;
                    actDiv.appendChild(btn);
                } else if (a.type === 'dist') {
                    renderDistCard(a.origin, a.facility, actDiv);
                }
            });

            frag.appendChild(actDiv);
        }

        return frag;
    }

    function addMessage(html, type) {
        const container = document.getElementById('messages-container');
        const wrapper = document.createElement('div');
        wrapper.className = 'msg-wrapper' + (type === 'user-msg' ? ' user-wrapper' : '');

        if (type !== 'user-msg') {
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar-small';
            avatar.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>';
            wrapper.appendChild(avatar);
        }
        const div = document.createElement('div');
        div.className = 'msg ' + type;

        if (type === 'bot-msg') {
            div.appendChild(renderBotContent(html));
        } else {
            div.textContent = html;
        }

        wrapper.appendChild(div);
        container.appendChild(wrapper);
        container.scrollTop = container.scrollHeight;

        if (type === 'bot-msg') speak(div.textContent);
    }

    function showTyping() {
        const c = document.getElementById('messages-container');
        const w = document.createElement('div');
        w.className = 'msg-wrapper'; w.id = 'typing-wrapper';
        const a = document.createElement('div');
        a.className = 'msg-avatar-small';
        a.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 100 10A5 5 0 0012 2zm0 12c-5.33 0-8 2.67-8 4v2h16v-2c0-1.33-2.67-4-8-4z"/></svg>';
        const t = document.createElement('div');
        t.className = 'msg bot-msg typing-indicator';
        t.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
        w.appendChild(a); w.appendChild(t);
        c.appendChild(w); c.scrollTop = c.scrollHeight;
    }
    function hideTyping() { const el = document.getElementById('typing-wrapper'); if (el) el.remove(); }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, 'user-msg');
        input.value = '';
        chatHistory.push({ role: 'user', content: text });
        showTyping();
        document.getElementById('send-btn').disabled = true;
        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ messages: chatHistory, lang: currentLang })
            });
            const data = await res.json();
            hideTyping();
            addMessage(data.reply, 'bot-msg');
            chatHistory.push({ role: 'assistant', content: data.reply });
        } catch (e) {
            hideTyping();
            addMessage(getLang().connError, 'error-msg');
        } finally {
            document.getElementById('send-btn').disabled = false;
        }
    }

        const on = document.body.classList.toggle('large-text');
        document.getElementById('btn-large').classList.toggle('active', on);
        document.getElementById('btn-large').setAttribute('aria-pressed', on);
    }
    function toggleHighContrast() {
        const on = document.body.classList.toggle('high-contrast');
        document.getElementById('btn-contrast').classList.toggle('active', on);
        document.getElementById('btn-contrast').setAttribute('aria-pressed', on);
    }
    function toggleVoice() {
        voiceEnabled = !voiceEnabled;
        document.getElementById('btn-voice').classList.toggle('active', voiceEnabled);
        document.getElementById('btn-voice').setAttribute('aria-pressed', voiceEnabled);
        if (voiceEnabled) speak(getLang().voiceOn || 'Voice reading enabled');
        else window.speechSynthesis && window.speechSynthesis.cancel();
    }
    function resetAccess() {
        document.body.classList.remove('large-text', 'high-contrast');
        voiceEnabled = false;
        ['btn-large','btn-contrast','btn-voice'].forEach(id => {
            document.getElementById(id).classList.remove('active');
            document.getElementById(id).setAttribute('aria-pressed', 'false');
        });
    }
    function speak(text) {
        if (!voiceEnabled || !window.speechSynthesis) return;
        const langMap = { he:'he-IL', en:'en-US', es:'es-ES', ru:'ru-RU', ar:'ar-SA', am:'am-ET' };
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = langMap[currentLang] || 'he-IL';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utt);
    }

    // Init
    applyLang('he');
    </script>

</body>
</html>
